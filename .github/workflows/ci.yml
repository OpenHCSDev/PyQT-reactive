name: CI

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install distribution validators
        run: python -m pip install build "twine>=7,<8"
      - name: Build release artifacts
        run: python -m build
      - name: Validate release artifacts
        run: python -m twine check dist/*

  # Test across Python versions and OSes
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt-platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            qt-platform: offscreen
          - os: windows-latest
            qt-platform: windows
          - os: macos-latest
            qt-platform: cocoa

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements-ci.txt -e ".[dev]"

      - name: Run tests with coverage
        timeout-minutes: 5
        run: |
          pytest --cov=pyqt_reactive --cov-report=xml --cov-report=html --cov-report=term-missing -v -o faulthandler_timeout=120

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements-ci.txt -e ".[dev]"

      - name: Run full-package Ruff fatal checks
        run: |
          ruff check src/ --select E9,F63,F7,F822,F823 --output-format=github

      - name: Resolve quality diff base
        id: quality-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$PUSH_BASE_SHA" ;;
            *) base_sha="" ;;
          esac
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] ||
             ! git cat-file -e "${base_sha}^{commit}"; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Reject Ruff diagnostics introduced on added lines
        run: |
          python scripts/check_ruff_added_lines.py \
            --base "${{ steps.quality-base.outputs.sha }}" \
            --head "$GITHUB_SHA"

      - name: Report repository-wide Ruff baseline (non-blocking)
        continue-on-error: true
        run: |
          ruff check src/ --statistics

      - name: Report repository-wide Black baseline (non-blocking)
        continue-on-error: true
        run: |
          black --check src/

      - name: Report repository-wide Mypy baseline (non-blocking)
        continue-on-error: true
        run: |
          mypy src/ --ignore-missing-imports

  # Documentation build check
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements-ci.txt -e ".[docs]"

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Check for build warnings
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"
