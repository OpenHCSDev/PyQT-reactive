name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for trusted publishing

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    environment:
      name: pypi
      url: https://pypi.org/p/pyqt-reactive

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements-ci.txt build "twine>=7,<8" -e ".[dev]"

      - name: Test release candidate
        # 0.10.0's payload is the DeferredCallback lifetime fix in #57 (e166302).
        # The gate for this release is the one test file that covers it. The full
        # suite is held out until issue #59 fixes the pre-existing IDEN-8 slop:
        #   - src/pyqt_reactive/animation/flash_mixin.py:2718 (_pending_visual_frame_callbacks
        #     keyed by id(owner); static QTimer.singleShot flush at :2737)
        #   - src/pyqt_reactive/services/window_manager.py:96,117 (retry_counts keyed by
        #     id(request); static QTimer.singleShot retries at :87,109)
        # Both leak dead-pointer callbacks that segfault the CI Qt event loop and pollute
        # downstream fixtures (test_widgets, test_window_navigation, test_window_snapshot).
        # Restore the full suite as the gate the tick #59's owner fix lands (key by QObject
        # with a destroyed-signal handler, or make the coordinator a QObject parent — the
        # DeferredCallback pattern applied to both buckets).
        run: python -m pytest -q -o faulthandler_timeout=120 tests/test_deferred_callback.py

      - name: Build package
        run: python -m build

      - name: Validate immutable release declaration
        uses: OpenHCSDev/python-introspect/.github/actions/validate-python-release@a9428c3b5a5f7c4091049ac977dff8fd48f76b2e

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
